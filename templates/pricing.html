<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kioku journal｜日記と習慣の記録</title>
<style>
body{font:1rem/1.8 system-ui,sans-serif;color:#19362d;background:#f1f6ef;margin:0}
main{max-width:44rem;margin:auto;padding:3rem 1.25rem}
section{background:white;border-radius:1rem;padding:1.25rem 1.5rem;margin:1.5rem 0}
a{color:#17624b} h1{line-height:1.3}
</style>
</head>
<body><main>
<p>kioku journal</p>
<h1>今日のことも、続けてきたことも。</h1>
<p>日記、読書、運動の記録をひとつに。毎日の小さな積み重ねを、あとから振り返れます。</p>
<section>
<h2>{{ "料金" if sales_available else "予定価格" }}</h2>
<p><strong>月額480円</strong> ／ <strong>年額4,800円</strong>（税込）</p>
{% if sales_available %}
<p>アカウントをお持ちの方は、ログインしてお申し込みください。契約は自動更新されます。</p>
<p><a href="{{ url_for('billing') }}">有料プランの申し込み</a></p>
{% else %}
<p>新規のお申し込みは準備中です。</p>
{% endif %}
</section>
<p><a href="{{ url_for('login') }}">既存ユーザーのログイン</a></p>
<p><a href="{{ url_for('tokusho') }}">特定商取引法に基づく表記</a></p>
</main></body></html>
